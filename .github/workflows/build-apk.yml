name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up official Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35 using preinstalled runner SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          tool="$(command -v sdkmanager || true)"
          if [[ -z "$tool" ]]; then
            tool="$(find "$sdk/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          if [[ -z "$tool" ]]; then echo "sdkmanager not found"; exit 1; fi
          "$tool" --version
          yes | "$tool" --sdk_root="$sdk" --licenses >/dev/null || true
          "$tool" --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0"
      - name: Run tests and assemble APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MiHRBridge-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiHRBridge-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14